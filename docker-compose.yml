# ReadMind 로컬 개발 인프라 (명세서 §7, §8 Phase 0 첫 항목)
# 기본 기동: postgres(pgvector) + redis + minio + 버킷 초기화.
#   docker compose up -d
# 애플리케이션(ai-service/backend)은 해당 Dockerfile 생성 후 app 프로파일로 기동:
#   docker compose --profile app up -d
# 모든 시크릿/접속정보는 .env 에서 주입한다(하드코딩 금지, CLAUDE.md §3).

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: readmind-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # pgvector 확장 등록 등 최초 1회 초기화 스크립트
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: readmind-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: readmind-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 웹 콘솔
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 최초 기동 시 S3 버킷 생성 후 종료(일회성)
  createbuckets:
    image: minio/mc
    container_name: readmind-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${S3_BUCKET} &&
      echo 'bucket ${S3_BUCKET} ready';
      "
    restart: "no"

  # ── 애플리케이션 (Dockerfile 생성 후 --profile app 으로 기동) ──
  ai-service:
    profiles: ["app"]
    build: ./ai-service
    container_name: readmind-ai-service
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  backend:
    profiles: ["app"]
    build: ./backend
    container_name: readmind-backend
    env_file: .env
    environment:
      # 기본은 로컬 컨테이너 postgres. 클라우드 DB(Neon 등)를 쓰려면 .env 에 SPRING_DATASOURCE_URL
      # (JDBC 형식, 예: jdbc:postgresql://<host>/<db>?sslmode=require) 과 SPRING_DATASOURCE_USERNAME/
      # PASSWORD 를 넣으면 여기 값이 그걸로 덮인다(env_file 우선). application.yml 이 JDBC 형식을 읽고,
      # .env 의 POSTGRES_URL(psycopg 형식)은 ai-service 전용이라 형식/키가 달라 backend 는 별도로 준다.
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB:-readmind}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    ports:
      - "8080:8080"
    restart: unless-stopped

  # 웹 정적 빌드(nginx). @readmind/shared 참조 때문에 컨텍스트는 레포 루트.
  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: readmind-web
    restart: unless-stopped

  # 엣지 리버스 프록시 + 자동 HTTPS. 유일한 공개 진입점(80/443).
  # APP_DOMAIN 을 실제 도메인으로 주면 Let's Encrypt 발급.
  caddy:
    profiles: ["app"]
    image: caddy:2-alpine
    container_name: readmind-caddy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    depends_on:
      web:
        condition: service_started
      backend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
