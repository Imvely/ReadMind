# 웹 정적 서빙(SPA). /api 라우팅·HTTPS는 엣지 Caddy가 담당하므로 여기선 정적 파일만.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 해시된 에셋은 장기 캐시.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: 없는 경로는 index.html 로 폴백(React Router 클라이언트 라우팅).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
